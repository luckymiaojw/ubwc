<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .head { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .label { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .axis { stroke: #334155; stroke-width: 2; }
      .tick { stroke: #334155; stroke-width: 2; }
      .rgba0 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .rgba1 { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.5; }
      .rgba2 { fill: #93c5fd; stroke: #2563eb; stroke-width: 1.5; }
      .rgba3 { fill: #60a5fa; stroke: #2563eb; stroke-width: 1.5; }
      .y0 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .y1 { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.5; }
      .uv { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; }
      .uv-slot { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="1120"/>

  <text class="title" x="60" y="58">UBWC 外部工作 SRAM：4096 像素宽度下的容量与布局关系</text>
  <text class="subtitle" x="60" y="88">bank0 / bank1 是同规格外部工作 SRAM。单 bank = 4096 word x 128 bit = 64 KiB；两 bank 合计 128 KiB。</text>
  <text class="subtitle" x="60" y="112">SRAM 容量主要由最大支持宽度决定；图像高度通过多次行组处理复用同一组 SRAM。</text>

  <rect class="panel" x="50" y="145" width="1380" height="270" rx="14"/>
  <text class="head" x="80" y="183">1. RGBA8888 / RGBA10：4096 宽时，一个行组占满一个 bank</text>
  <text class="subtitle" x="80" y="209">4096 px x 4 Byte = 16384 Byte/line = 1024 word/line；4 行共 4096 word。</text>

  <g transform="translate(80 245)">
    <line class="axis" x1="0" y1="105" x2="1280" y2="105"/>
    <line class="tick" x1="0" y1="95" x2="0" y2="115"/>
    <line class="tick" x1="320" y1="95" x2="320" y2="115"/>
    <line class="tick" x1="640" y1="95" x2="640" y2="115"/>
    <line class="tick" x1="960" y1="95" x2="960" y2="115"/>
    <line class="tick" x1="1280" y1="95" x2="1280" y2="115"/>

    <rect class="rgba0" x="0" y="0" width="320" height="78"/>
    <rect class="rgba1" x="320" y="0" width="320" height="78"/>
    <rect class="rgba2" x="640" y="0" width="320" height="78"/>
    <rect class="rgba3" x="960" y="0" width="320" height="78"/>

    <text class="label" x="126" y="30">Row 0</text>
    <text class="mono" x="112" y="54">1024w</text>
    <text class="label" x="446" y="30">Row 1</text>
    <text class="mono" x="432" y="54">1024w</text>
    <text class="label" x="766" y="30">Row 2</text>
    <text class="mono" x="752" y="54">1024w</text>
    <text class="label" x="1086" y="30">Row 3</text>
    <text class="mono" x="1072" y="54">1024w</text>

    <text class="mono" x="-8" y="137">0</text>
    <text class="mono" x="282" y="137">1024</text>
    <text class="mono" x="602" y="137">2048</text>
    <text class="mono" x="922" y="137">3072</text>
    <text class="mono" x="1238" y="137">4095</text>
    <text class="small" x="0" y="166">bank0 和 bank1 轮流作为当前行组写入/读出工作区；bank 不是固定 plane。</text>
  </g>

  <rect class="panel" x="50" y="450" width="1380" height="410" rx="14"/>
  <text class="head" x="80" y="488">2. YUV420（NV12 / P010）：4096 宽时，Y 固定区 + UV_A/UV_B 双区交替</text>
  <text class="subtitle" x="80" y="514">每个 bank：Y 区为 word 0..2047，UV_A 为 2048..3071，UV_B 为 3072..4095；各格式按自身每像素字节数映射行。</text>
  <text class="subtitle" x="80" y="540">UV_A 读出按 tile 进行，需要 BANK0.UV_A 与 BANK1.UV_A 配对同时读；UV_B 写入在两个 bank 间交替推进。</text>

  <g transform="translate(80 585)">
    <text class="label" x="0" y="-16">UV_A tile 读出：BANK0.UV_A 与 BANK1.UV_A 同时读，拼成完整 UV tile</text>
    <line class="axis" x1="0" y1="105" x2="1280" y2="105"/>
    <line class="tick" x1="0" y1="95" x2="0" y2="115"/>
    <line class="tick" x1="640" y1="95" x2="640" y2="115"/>
    <line class="tick" x1="960" y1="95" x2="960" y2="115"/>
    <line class="tick" x1="1280" y1="95" x2="1280" y2="115"/>

    <rect class="y0" x="0" y="0" width="640" height="78"/>
    <rect class="uv" x="640" y="0" width="320" height="78"/>
    <rect class="uv-slot" x="960" y="0" width="320" height="78"/>

    <text class="label" x="284" y="28">Y</text>
    <text class="mono" x="242" y="52">current Y row group</text>
    <text class="mono" x="292" y="70">2048w</text>
    <text class="label" x="752" y="28">UV_A</text>
    <text class="mono" x="714" y="52">BANK0/1 pair read</text>
    <text class="mono" x="764" y="70">1024w</text>
    <text class="label" x="1054" y="32">UV_B</text>
    <text class="mono" x="1018" y="58">write slot</text>
    <text class="mono" x="1080" y="76">1024w</text>

    <text class="mono" x="-8" y="137">0</text>
    <text class="mono" x="602" y="137">2048</text>
    <text class="mono" x="922" y="137">3072</text>
    <text class="mono" x="1238" y="137">4095</text>
  </g>

  <g transform="translate(80 755)">
    <text class="label" x="0" y="-16">UV_B 写入：写侧在 BANK0.UV_B / BANK1.UV_B 间交替写入下一组 UV</text>
    <line class="axis" x1="0" y1="105" x2="1280" y2="105"/>
    <line class="tick" x1="0" y1="95" x2="0" y2="115"/>
    <line class="tick" x1="640" y1="95" x2="640" y2="115"/>
    <line class="tick" x1="960" y1="95" x2="960" y2="115"/>
    <line class="tick" x1="1280" y1="95" x2="1280" y2="115"/>

    <rect class="y1" x="0" y="0" width="640" height="78"/>
    <rect class="uv-slot" x="640" y="0" width="320" height="78"/>
    <rect class="uv" x="960" y="0" width="320" height="78"/>

    <text class="label" x="284" y="28">Y</text>
    <text class="mono" x="244" y="52">next Y row group</text>
    <text class="mono" x="292" y="70">2048w</text>
    <text class="label" x="752" y="32">UV_A</text>
    <text class="mono" x="710" y="58">tile read pair</text>
    <text class="mono" x="764" y="76">1024w</text>
    <text class="label" x="1072" y="28">UV_B</text>
    <text class="mono" x="1036" y="52">BANK0/1 alternate write</text>
    <text class="mono" x="1080" y="70">1024w</text>

    <text class="mono" x="-8" y="137">0</text>
    <text class="mono" x="602" y="137">2048</text>
    <text class="mono" x="922" y="137">3072</text>
    <text class="mono" x="1238" y="137">4095</text>
  </g>

  <rect class="panel" x="50" y="895" width="1380" height="150" rx="14"/>
  <text class="head" x="80" y="933">3. 读图说明</text>
  <text class="subtitle" x="80" y="966">NV12/P010 下，UV 读出按 tile 粒度配对访问两个 bank；UV 写入按行组在两个 bank 的 UV_A/UV_B 区域交替推进。</text>
  <text class="subtitle" x="80" y="994">软件不需要配置 UV_A/UV_B，只需要配置每帧 UBWC base address；配对读和交替写由硬件 line_to_otf / SRAM 调度完成。</text>
  <rect class="note" x="80" y="1015" width="1320" height="28" rx="10"/>
  <text class="small" x="100" y="1035">备注：本图描述 DEC 非旋转路径；单 bank 64 KiB，两个 bank 合计 128 KiB，支持最大 4096 px 输入宽度。</text>
</svg>
