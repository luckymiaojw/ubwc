<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1020" viewBox="0 0 1580 1020">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 28px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .h2 { font: 700 20px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .txt { font: 500 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .mono { font: 600 13px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; rx: 14; }
      .in { fill: #eff6ff; stroke: #3b82f6; }
      .mem { fill: #fff7ed; stroke: #fb923c; }
      .calc { fill: #ecfdf5; stroke: #10b981; }
      .out { fill: #f5f3ff; stroke: #8b5cf6; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-dasharray: 7 5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .arrowOrange { fill: none; stroke: #ea580c; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .arrowPurple { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1580" height="1020"/>
  <text class="title" x="50" y="58">ubwc_enc_vivo_top Fake 输出路径</text>
  <text class="subtitle" x="50" y="88">fake 模式只负责根据坐标和 golden memory 产生 CO/CVO；checker 在 testbench 外部完成。</text>

  <rect class="box mem" x="60" y="135" width="360" height="230"/>
  <text class="h2" x="85" y="174">Fake Memory 初始化</text>
  <text class="mono" x="85" y="208">expected_tile_plane0/1.memh</text>
  <text class="mono" x="85" y="232">expected_cmp_plane0/1.memh</text>
  <text class="mono" x="85" y="256">expected_meta_plane0/1.memh</text>
  <text class="small" x="85" y="292">tile memory 用于按坐标取 uncompressed tile</text>
  <text class="small" x="85" y="318">cmp memory 用于按 compressed addr 取 CVO 数据</text>
  <text class="small" x="85" y="342">meta memory 用于按 x/y 取 metadata byte</text>

  <rect class="box in" x="60" y="430" width="360" height="195"/>
  <text class="h2" x="85" y="468">CI 输入</text>
  <text class="mono" x="85" y="500">i_ci_valid &amp; o_ci_ready</text>
  <text class="mono" x="85" y="524">i_ci_format / xcoord / ycoord</text>
  <text class="mono" x="85" y="548">i_ci_metadata / i_ci_alen</text>
  <text class="mono" x="85" y="572">i_ci_forced_pcm</text>
  <text class="small" x="85" y="602">fake 模式下 metadata/alen 由 memory 推导</text>

  <rect class="box in" x="60" y="690" width="360" height="175"/>
  <text class="h2" x="85" y="728">RVI 输入</text>
  <text class="mono" x="85" y="760">i_rvi_valid &amp; o_rvi_ready</text>
  <text class="mono" x="85" y="784">i_rvi_data/mask/last</text>
  <text class="mono" x="85" y="808">i_rvi_format / xcoord / ycoord</text>
  <text class="small" x="85" y="838">fake 模式下 RVI 第 1 beat 用于启动 CVO 命令</text>

  <rect class="box calc" x="510" y="145" width="450" height="170"/>
  <text class="h2" x="535" y="182">Metadata 取数</text>
  <text class="mono" x="535" y="214">fake_meta_byte(format, x, y)</text>
  <text class="txt" x="535" y="244">按 meta layout 算 byte offset，再从 meta0/1 memory 取 byte</text>
  <text class="txt" x="535" y="272">UV plane 使用 meta1，Y/RGBA 使用 meta0</text>

  <rect class="box calc" x="510" y="365" width="450" height="190"/>
  <text class="h2" x="535" y="402">CI 结果推导</text>
  <text class="mono" x="535" y="434">ci_alen = metadata[3:1]</text>
  <text class="mono" x="535" y="458">valid_beats = alen + 1</text>
  <text class="mono" x="535" y="482">pcm = metadata[5]</text>
  <text class="mono" x="535" y="506">cmp_addr = fake_tile_addr_with_alen()</text>
  <text class="small" x="535" y="532">ci_fire 时锁存 addr / beats，等待 RVI tile start 使用</text>

  <rect class="box out" x="1070" y="390" width="430" height="160"/>
  <text class="h2" x="1095" y="428">CO 输出</text>
  <text class="mono" x="1095" y="460">o_co_valid &lt;= ci_fire</text>
  <text class="mono" x="1095" y="484">o_co_alen  &lt;= ci_alen_from_metadata</text>
  <text class="mono" x="1095" y="508">o_co_pcm   &lt;= metadata[5]</text>
  <text class="small" x="1095" y="532">非 fake 模式直接透传 i_ci_alen / i_ci_forced_pcm</text>

  <rect class="box calc" x="510" y="645" width="450" height="205"/>
  <text class="h2" x="535" y="682">CVO 命令启动</text>
  <text class="mono" x="535" y="714">fake_rvi_start_fire</text>
  <text class="txt" x="535" y="744">当 RVI 当前 beat 是 tile start，</text>
  <text class="txt" x="535" y="770">把 CI 锁存的 cmp_addr / valid_beats / total_beats</text>
  <text class="txt" x="535" y="796">转成 fake_cvo_cmd_*，开始输出 compressed data</text>
  <text class="small" x="535" y="824">o_rvi_ready 在 tile start 时受 command accept gating</text>

  <rect class="box out" x="1070" y="645" width="430" height="215"/>
  <text class="h2" x="1095" y="682">CVO 输出</text>
  <text class="mono" x="1095" y="714">o_cvo_valid = fake_cvo_cmd_valid</text>
  <text class="mono" x="1095" y="738">o_cvo_data = fake_pack_cmp_axi_word()</text>
  <text class="mono" x="1095" y="762">addr = cmd_addr + beat_idx * 32</text>
  <text class="mono" x="1095" y="786">mask = all 1 when beat_idx &lt; valid_beats</text>
  <text class="mono" x="1095" y="810">last = beat_idx == total_beats - 1</text>
  <text class="small" x="1095" y="836">非 fake 模式直接透传 RVI data/mask/last</text>

  <rect class="box note" x="510" y="895" width="990" height="70"/>
  <text class="h2" x="535" y="927">边界</text>
  <text class="txt" x="535" y="952">enc_vivo_top 不做数据正确性判断；CI/RVI/CVO/AXI 比对由 TB 在 wrapper 接口和 AXI sink 完成。</text>

  <path class="arrowOrange" d="M420 250 H510"/>
  <path class="arrowBlue" d="M420 520 H480 V445 H510"/>
  <path class="arrowGreen" d="M735 315 V365"/>
  <path class="arrowPurple" d="M960 455 H1070"/>
  <path class="arrowBlue" d="M420 780 H510"/>
  <path class="arrowGreen" d="M735 555 V645"/>
  <path class="arrowPurple" d="M960 745 H1070"/>
  <path class="arrowOrange" d="M420 250 H470 V750 H510"/>

  <text class="small" x="440" y="235">meta memory</text>
  <text class="small" x="438" y="505">format/x/y</text>
  <text class="small" x="978" y="435">CO side</text>
  <text class="small" x="440" y="762">tile start</text>
  <text class="small" x="978" y="728">CVO side</text>
</svg>
