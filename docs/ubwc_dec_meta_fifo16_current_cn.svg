<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="930" viewBox="0 0 1720 930">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-text { font-size: 13px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .note { font-size: 14px; fill: #334155; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 10; }
      .axi { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .ctrl { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 10; }
      .fifo-uv { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6; }
      .fifo-y { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .sched { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
      .decode { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .data { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .dash { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1720" height="930" fill="#f8fafc"/>
  <rect width="1720" height="930" fill="url(#grid)" opacity="0.55"/>

  <text x="52" y="58" class="title">DEC Metadata 8x8 Block 与 16 通道重排</text>
  <text x="52" y="88" class="subtitle">当前 RTL：每个 metadata block 为 64 Byte；AXI Core 侧用 2 个 256-bit beat 读回，写入 16 个独立的 32 x 64-bit FIFO。</text>

  <rect x="70" y="135" width="230" height="92" class="box"/>
  <text x="185" y="166" text-anchor="middle" class="box-title">DDR Metadata</text>
  <text x="185" y="190" text-anchor="middle" class="box-text">8 rows x 8 bytes</text>
  <text x="185" y="211" text-anchor="middle" class="box-text">64 Byte / block</text>

  <rect x="380" y="135" width="250" height="92" class="ctrl"/>
  <text x="505" y="166" text-anchor="middle" class="box-title">8x8 Block Command</text>
  <text x="505" y="190" text-anchor="middle" class="box-text">plane / block x,y / valid rows</text>
  <text x="505" y="211" text-anchor="middle" class="box-text">先检查目标 FIFO credit</text>

  <rect x="710" y="135" width="250" height="92" class="axi"/>
  <text x="835" y="166" text-anchor="middle" class="box-title">Metadata AXI Read</text>
  <text x="835" y="190" text-anchor="middle" class="box-text">ARLEN=1, ARSIZE=5</text>
  <text x="835" y="211" text-anchor="middle" class="box-text">2 x 256-bit = 512-bit</text>

  <rect x="1040" y="135" width="250" height="92" class="box"/>
  <text x="1165" y="166" text-anchor="middle" class="box-title">Block Assemble</text>
  <text x="1165" y="190" text-anchor="middle" class="box-text">RID/frame_id 校验</text>
  <text x="1165" y="211" text-anchor="middle" class="box-text">stale response 直接丢弃</text>

  <rect x="1370" y="135" width="260" height="92" class="ctrl"/>
  <text x="1500" y="166" text-anchor="middle" class="box-title">Channel Demux</text>
  <text x="1500" y="190" text-anchor="middle" class="box-text">按 format / plane / rotate</text>
  <text x="1500" y="211" text-anchor="middle" class="box-text">一次 block 分发到 8 个通道</text>

  <path class="flow" d="M300 181 H380"/>
  <path class="flow" d="M630 181 H710"/>
  <path class="data" d="M960 181 H1040"/>
  <path class="data" d="M1290 181 H1370"/>

  <rect x="70" y="285" width="1560" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text x="96" y="320" class="box-title">16-Channel Metadata FIFO Array</text>
  <text x="96" y="345" class="box-text">每通道 32 entries x 64-bit = 256 Byte；总容量 16 x 256 Byte = 4096 Byte。</text>

  <g transform="translate(95,375)">
    <rect x="0" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="85" y="29" text-anchor="middle" class="box-title">CH0 / UV row0</text>
    <text x="85" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="185" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="270" y="29" text-anchor="middle" class="box-title">CH1 / UV row1</text>
    <text x="270" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="370" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="455" y="29" text-anchor="middle" class="box-title">CH2 / UV row2</text>
    <text x="455" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="555" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="640" y="29" text-anchor="middle" class="box-title">CH3 / UV row3</text>
    <text x="640" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="740" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="825" y="29" text-anchor="middle" class="box-title">CH4 / UV row4</text>
    <text x="825" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="925" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="1010" y="29" text-anchor="middle" class="box-title">CH5 / UV row5</text>
    <text x="1010" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="1110" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="1195" y="29" text-anchor="middle" class="box-title">CH6 / UV row6</text>
    <text x="1195" y="53" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="1295" y="0" width="170" height="72" class="fifo-uv"/>
    <text x="1380" y="29" text-anchor="middle" class="box-title">CH7 / UV row7</text>
    <text x="1380" y="53" text-anchor="middle" class="small">32 x 64-bit</text>

    <rect x="0" y="105" width="170" height="72" class="fifo-y"/>
    <text x="85" y="134" text-anchor="middle" class="box-title">CH8 / Y row0</text>
    <text x="85" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="185" y="105" width="170" height="72" class="fifo-y"/>
    <text x="270" y="134" text-anchor="middle" class="box-title">CH9 / Y row1</text>
    <text x="270" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="370" y="105" width="170" height="72" class="fifo-y"/>
    <text x="455" y="134" text-anchor="middle" class="box-title">CH10 / Y row2</text>
    <text x="455" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="555" y="105" width="170" height="72" class="fifo-y"/>
    <text x="640" y="134" text-anchor="middle" class="box-title">CH11 / Y row3</text>
    <text x="640" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="740" y="105" width="170" height="72" class="fifo-y"/>
    <text x="825" y="134" text-anchor="middle" class="box-title">CH12 / Y row4</text>
    <text x="825" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="925" y="105" width="170" height="72" class="fifo-y"/>
    <text x="1010" y="134" text-anchor="middle" class="box-title">CH13 / Y row5</text>
    <text x="1010" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="1110" y="105" width="170" height="72" class="fifo-y"/>
    <text x="1195" y="134" text-anchor="middle" class="box-title">CH14 / Y row6</text>
    <text x="1195" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
    <rect x="1295" y="105" width="170" height="72" class="fifo-y"/>
    <text x="1380" y="134" text-anchor="middle" class="box-title">CH15 / Y row7</text>
    <text x="1380" y="158" text-anchor="middle" class="small">32 x 64-bit</text>
  </g>

  <text x="98" y="580" class="small">RGBA 模式复用全部 16 个通道；NV12/P010 非旋转时 CH0..7 保存 UV、CH8..15 保存 Y；rotation 仅支持 NV12。</text>
  <path class="data" d="M1500 227 V265 H850 V285"/>

  <rect x="160" y="685" width="350" height="118" class="sched"/>
  <text x="335" y="716" text-anchor="middle" class="box-title">Non-Rotation Scheduler</text>
  <text x="335" y="742" text-anchor="middle" class="box-text">NV12 / P010：UV → Y0 → Y1</text>
  <text x="335" y="764" text-anchor="middle" class="box-text">RGBA：CH0..7 → CH8..15</text>
  <text x="335" y="786" text-anchor="middle" class="box-text">按原始 tile 坐标顺序输出</text>

  <rect x="685" y="685" width="350" height="118" class="sched"/>
  <text x="860" y="716" text-anchor="middle" class="box-title">Rotation Scheduler</text>
  <text x="860" y="742" text-anchor="middle" class="box-text">仅 NV12，按列顺序输出</text>
  <text x="860" y="764" text-anchor="middle" class="box-text">ROT90 正向 / ROT270 反向</text>
  <text x="860" y="786" text-anchor="middle" class="box-text">坐标由读侧计数器重建</text>

  <rect x="1210" y="685" width="350" height="118" class="decode"/>
  <text x="1385" y="716" text-anchor="middle" class="box-title">Metadata Decode</text>
  <text x="1385" y="742" text-anchor="middle" class="box-text">meta byte → alen / flag / alpha</text>
  <text x="1385" y="764" text-anchor="middle" class="box-text">输出 format / x / y / frame_id</text>
  <text x="1385" y="786" text-anchor="middle" class="box-text">驱动 tile AXI command</text>

  <path class="data" d="M580 605 V640 H335 V685"/>
  <path class="data" d="M1140 605 V640 H860 V685"/>
  <rect x="1080" y="720" width="90" height="48" class="box"/>
  <text x="1125" y="749" text-anchor="middle" class="small">mode mux</text>
  <path class="flow" d="M510 744 V825 H1125 V768"/>
  <path class="flow" d="M1035 744 H1080"/>
  <path class="flow" d="M1170 744 H1210"/>

  <rect x="90" y="850" width="1540" height="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="115" y="880" class="note">发 AR 前预留目标 FIFO credit；R beat 写入后释放 outstanding reservation，避免 AXI 返回数据超过本地接收容量。</text>
</svg>
