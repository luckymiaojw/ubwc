<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180">
  <defs>
    <style>
      .bg { fill:#f7f9fc; }
      .card { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; }
      .title { font-family:Arial, "Microsoft YaHei", sans-serif; font-size:34px; font-weight:700; fill:#111827; }
      .h2 { font-family:Arial, "Microsoft YaHei", sans-serif; font-size:24px; font-weight:700; fill:#111827; }
      .txt { font-family:Arial, "Microsoft YaHei", sans-serif; font-size:18px; fill:#334155; }
      .small { font-family:Arial, "Microsoft YaHei", sans-serif; font-size:15px; fill:#475569; }
      .mono { font-family:"SFMono-Regular", Menlo, Consolas, monospace; font-size:16px; fill:#1f2937; }
      .addr { font-family:"SFMono-Regular", Menlo, Consolas, monospace; font-size:14px; fill:#334155; }
      .sram { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; }
      .uvA { fill:#dff7ff; stroke:#0284c7; stroke-width:2; }
      .uvB { fill:#ffe8cc; stroke:#ea580c; stroke-width:2; }
      .y0 { fill:#dcfce7; stroke:#16a34a; stroke-width:2; }
      .y1 { fill:#e9d5ff; stroke:#9333ea; stroke-width:2; }
      .res { fill:#f1f5f9; stroke:#94a3b8; stroke-width:2; stroke-dasharray:7 6; }
      .grid { fill:#ffffff; stroke:#94a3b8; stroke-width:1; }
      .line { stroke:#334155; stroke-width:2.4; fill:none; }
      .blue { stroke:#0284c7; stroke-width:3; fill:none; }
      .orange { stroke:#ea580c; stroke-width:3; fill:none; }
      .green { stroke:#16a34a; stroke-width:3; fill:none; }
      .purple { stroke:#9333ea; stroke-width:3; fill:none; }
      .dash { stroke-dasharray:7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="1180"/>
  <text class="title" x="56" y="62">DEC Rotation Metadata Ping-Pong SRAM：双 SRAM 存储结构</text>
  <text class="txt" x="56" y="98">每个 SRAM 存一半 UV_A、一组 Y、再存一半 UV_B；写入是整段写入，读出按 OTF 行节奏从两个 SRAM 组合。</text>

  <g transform="translate(56,128)">
    <rect class="uvA" x="0" y="0" width="130" height="34" rx="6"/>
    <text class="small" x="18" y="23">1/2 UV_A</text>
    <rect class="y0" x="156" y="0" width="96" height="34" rx="6"/>
    <text class="small" x="188" y="23">Y0</text>
    <rect class="y1" x="278" y="0" width="96" height="34" rx="6"/>
    <text class="small" x="310" y="23">Y1</text>
    <rect class="uvB" x="400" y="0" width="130" height="34" rx="6"/>
    <text class="small" x="418" y="23">1/2 UV_B</text>
    <rect class="res" x="556" y="0" width="120" height="34" rx="6"/>
    <text class="small" x="585" y="23">Reserved</text>
  </g>

  <rect class="card" x="48" y="184" width="1664" height="430" rx="16"/>
  <text class="h2" x="80" y="224">1. 一次 ping/pang 存储后的两个 SRAM 物理布局</text>
  <text class="txt" x="80" y="258">UV_A 和 UV_B 各自拆成两半，分别放入 SRAM0 与 SRAM1；Y0/Y1 分别对应相邻两条 Y 输出行组。</text>

  <g transform="translate(92,292)">
    <text class="h2" x="0" y="32">SRAM0 / PING</text>
    <rect class="sram" x="0" y="58" width="1576" height="118" rx="10"/>
    <rect class="uvA" x="20" y="78" width="330" height="78" rx="6"/>
    <rect class="y0" x="350" y="78" width="610" height="78" rx="6"/>
    <rect class="uvB" x="960" y="78" width="330" height="78" rx="6"/>
    <rect class="res" x="1290" y="78" width="266" height="78" rx="6"/>
    <text class="mono" x="62" y="113">UV_A half0</text>
    <text class="small" x="58" y="139">多个 8x8 meta block</text>
    <text class="mono" x="610" y="113">Y0 blocks</text>
    <text class="small" x="552" y="139">Y row group 0，对应输出 Y0</text>
    <text class="mono" x="1002" y="113">UV_B half0</text>
    <text class="small" x="998" y="139">多个 8x8 meta block</text>
    <text class="mono" x="1368" y="122">Reserved</text>
    <path class="line" d="M20,190 H1556"/>
    <path class="line" d="M20,182 V198 M350,182 V198 M960,182 V198 M1290,182 V198 M1556,182 V198"/>
    <text class="addr" x="20" y="220" text-anchor="middle">0</text>
    <text class="addr" x="350" y="220" text-anchor="middle">UV_A/2 end</text>
    <text class="addr" x="960" y="220" text-anchor="middle">Y0 end</text>
    <text class="addr" x="1290" y="220" text-anchor="middle">UV_B/2 end</text>
    <text class="addr" x="1556" y="220" text-anchor="middle">SRAM end</text>
  </g>

  <g transform="translate(92,438)">
    <text class="h2" x="0" y="32">SRAM1 / PANG</text>
    <rect class="sram" x="0" y="58" width="1576" height="118" rx="10"/>
    <rect class="uvA" x="20" y="78" width="330" height="78" rx="6"/>
    <rect class="y1" x="350" y="78" width="610" height="78" rx="6"/>
    <rect class="uvB" x="960" y="78" width="330" height="78" rx="6"/>
    <rect class="res" x="1290" y="78" width="266" height="78" rx="6"/>
    <text class="mono" x="62" y="113">UV_A half1</text>
    <text class="small" x="58" y="139">与 SRAM0 half0 拼成完整 UV_A</text>
    <text class="mono" x="610" y="113">Y1 blocks</text>
    <text class="small" x="552" y="139">Y row group 1，对应输出 Y1</text>
    <text class="mono" x="1002" y="113">UV_B half1</text>
    <text class="small" x="998" y="139">与 SRAM0 half0 拼成完整 UV_B</text>
    <text class="mono" x="1368" y="122">Reserved</text>
    <path class="line" d="M20,190 H1556"/>
    <path class="line" d="M20,182 V198 M350,182 V198 M960,182 V198 M1290,182 V198 M1556,182 V198"/>
    <text class="addr" x="20" y="220" text-anchor="middle">0</text>
    <text class="addr" x="350" y="220" text-anchor="middle">UV_A/2 end</text>
    <text class="addr" x="960" y="220" text-anchor="middle">Y1 end</text>
    <text class="addr" x="1290" y="220" text-anchor="middle">UV_B/2 end</text>
    <text class="addr" x="1556" y="220" text-anchor="middle">SRAM end</text>
  </g>

  <rect class="card" x="48" y="650" width="1664" height="270" rx="16"/>
  <text class="h2" x="80" y="690">2. Segment 内部由多个 8x8 metadata block 组成</text>
  <text class="txt" x="80" y="724">一个小方格表示一个 8x8 metadata block；segment 内部 block 的组织方式由是否旋转决定。</text>

  <g transform="translate(92,760)">
    <text class="h2" x="0" y="0">不旋转：按行组成</text>
    <g transform="translate(0,24)">
      <rect class="grid" x="0" y="0" width="240" height="120"/>
      <path class="grid" d="M30,0 V120 M60,0 V120 M90,0 V120 M120,0 V120 M150,0 V120 M180,0 V120 M210,0 V120"/>
      <path class="grid" d="M0,30 H240 M0,60 H240 M0,90 H240"/>
      <path class="blue" marker-end="url(#arrowBlue)" d="M16,15 H224"/>
      <path class="blue" marker-end="url(#arrowBlue)" d="M16,45 H224"/>
      <path class="blue" marker-end="url(#arrowBlue)" d="M16,75 H224"/>
      <path class="blue" marker-end="url(#arrowBlue)" d="M16,105 H224"/>
    </g>
    <text class="mono" x="280" y="70">row0: block x0, x1, ...</text>
    <text class="mono" x="280" y="100">row1: block x0, x1, ...</text>
  </g>

  <g transform="translate(880,760)">
    <text class="h2" x="0" y="0">旋转 90/270：按列组成</text>
    <g transform="translate(0,24)">
      <rect class="grid" x="0" y="0" width="240" height="120"/>
      <path class="grid" d="M30,0 V120 M60,0 V120 M90,0 V120 M120,0 V120 M150,0 V120 M180,0 V120 M210,0 V120"/>
      <path class="grid" d="M0,30 H240 M0,60 H240 M0,90 H240"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M15,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M45,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M75,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M105,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M135,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M165,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M195,14 V106"/>
      <path class="orange" marker-end="url(#arrowOrange)" d="M225,14 V106"/>
    </g>
    <text class="mono" x="280" y="70">col0: block y0, y1, ...</text>
    <text class="mono" x="280" y="100">col1: block y0, y1, ...</text>
  </g>

  <rect class="card" x="48" y="956" width="1664" height="170" rx="16"/>
  <text class="h2" x="80" y="996">3. 读出关系</text>
  <text class="txt" x="80" y="1030">读 UV_A 或 UV_B 时，两个 SRAM 的 1/2 UV 同时参与，组合成完整 UV meta；旋转 NV12 送后级时按 UV、Y、UV、Y 交替。</text>
  <g transform="translate(92,1060)">
    <rect class="uvA" x="0" y="0" width="220" height="46" rx="6"/>
    <text class="mono" x="30" y="30">SRAM0 UV half</text>
    <rect class="uvA" x="300" y="0" width="220" height="46" rx="6"/>
    <text class="mono" x="330" y="30">SRAM1 UV half</text>
    <path class="blue" marker-end="url(#arrowBlue)" d="M220,23 H300"/>
    <rect class="y0" x="620" y="0" width="170" height="46" rx="6"/>
    <text class="mono" x="670" y="30">Y0</text>
    <rect class="y1" x="850" y="0" width="170" height="46" rx="6"/>
    <text class="mono" x="900" y="30">Y1</text>
    <text class="mono" x="1110" y="20">旋转 NV12 读出：UV -> Y0 -> UV -> Y1 -> ...</text>
    <text class="small" x="1110" y="46">UV/Y 坐标由旋转后的输出行列映射决定</text>
  </g>
</svg>
