<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .head { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .label { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .axis { stroke: #334155; stroke-width: 2; }
      .tick { stroke: #334155; stroke-width: 2; }
      .rgba0 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .rgba1 { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.5; }
      .rgba2 { fill: #93c5fd; stroke: #2563eb; stroke-width: 1.5; }
      .rgba3 { fill: #60a5fa; stroke: #2563eb; stroke-width: 1.5; }
      .y { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .uva { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; }
      .uvb { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="1010"/>
  <text class="title" x="60" y="58">ENC 外部工作 SRAM：2048 像素宽度下的容量与布局</text>
  <text class="subtitle" x="60" y="88">bank0 / bank1 为同规格 ping-pong SRAM。单 bank = 2048 word x 128 bit = 32 KiB；两 bank 合计 64 KiB。</text>
  <text class="subtitle" x="60" y="112">地址单位为 128-bit word；图像高度通过行组轮转复用，不需要整帧 SRAM。</text>

  <rect class="panel" x="50" y="145" width="1380" height="270" rx="14"/>
  <text class="head" x="80" y="183">1. RGBA8888 / RGBA1010102：单个 4-line 行组占满一个 bank</text>
  <text class="subtitle" x="80" y="209">2048 px x 4 Byte = 8192 Byte/line = 512 word/line；4 行共 2048 word。</text>

  <g transform="translate(80 245)">
    <rect class="rgba0" x="0" y="0" width="320" height="78"/>
    <rect class="rgba1" x="320" y="0" width="320" height="78"/>
    <rect class="rgba2" x="640" y="0" width="320" height="78"/>
    <rect class="rgba3" x="960" y="0" width="320" height="78"/>
    <text class="label" x="132" y="31">Row 0</text>
    <text class="mono" x="132" y="55">512w</text>
    <text class="label" x="452" y="31">Row 1</text>
    <text class="mono" x="452" y="55">512w</text>
    <text class="label" x="772" y="31">Row 2</text>
    <text class="mono" x="772" y="55">512w</text>
    <text class="label" x="1092" y="31">Row 3</text>
    <text class="mono" x="1092" y="55">512w</text>
    <line class="axis" x1="0" y1="105" x2="1280" y2="105"/>
    <line class="tick" x1="0" y1="95" x2="0" y2="115"/>
    <line class="tick" x1="320" y1="95" x2="320" y2="115"/>
    <line class="tick" x1="640" y1="95" x2="640" y2="115"/>
    <line class="tick" x1="960" y1="95" x2="960" y2="115"/>
    <line class="tick" x1="1280" y1="95" x2="1280" y2="115"/>
    <text class="mono" x="-8" y="139">0</text>
    <text class="mono" x="296" y="139">512</text>
    <text class="mono" x="602" y="139">1024</text>
    <text class="mono" x="922" y="139">1536</text>
    <text class="mono" x="1238" y="139">2047</text>
    <text class="small" x="0" y="169">bank0 与 bank1 轮流承担当前行组写入和上一行组读出。</text>
  </g>

  <rect class="panel" x="50" y="450" width="1380" height="430" rx="14"/>
  <text class="head" x="80" y="488">2. NV12 / P010：Y 固定区 + UV_A / UV_B 双区</text>
  <text class="subtitle" x="80" y="514">两种格式在最大宽度下均使用 1024-word Y 区和两个 512-word UV slot；UV_A/UV_B 交替复用以允许读写重叠。</text>

  <g transform="translate(80 560)">
    <text class="label" x="0" y="-15">bank0</text>
    <rect class="y" x="0" y="0" width="640" height="74"/>
    <rect class="uva" x="640" y="0" width="320" height="74"/>
    <rect class="uvb" x="960" y="0" width="320" height="74"/>
    <text class="label" x="292" y="29">Y</text>
    <text class="mono" x="278" y="53">1024w</text>
    <text class="label" x="778" y="29">UV_A</text>
    <text class="mono" x="772" y="53">512w</text>
    <text class="label" x="1098" y="29">UV_B</text>
    <text class="mono" x="1092" y="53">512w</text>

    <text class="label" x="0" y="118">bank1</text>
    <rect class="y" x="0" y="136" width="640" height="74"/>
    <rect class="uva" x="640" y="136" width="320" height="74"/>
    <rect class="uvb" x="960" y="136" width="320" height="74"/>
    <text class="label" x="292" y="165">Y</text>
    <text class="mono" x="278" y="189">1024w</text>
    <text class="label" x="778" y="165">UV_A</text>
    <text class="mono" x="772" y="189">512w</text>
    <text class="label" x="1098" y="165">UV_B</text>
    <text class="mono" x="1092" y="189">512w</text>

    <line class="axis" x1="0" y1="244" x2="1280" y2="244"/>
    <line class="tick" x1="0" y1="234" x2="0" y2="254"/>
    <line class="tick" x1="640" y1="234" x2="640" y2="254"/>
    <line class="tick" x1="960" y1="234" x2="960" y2="254"/>
    <line class="tick" x1="1280" y1="234" x2="1280" y2="254"/>
    <text class="mono" x="-8" y="277">0</text>
    <text class="mono" x="602" y="277">1024</text>
    <text class="mono" x="922" y="277">1536</text>
    <text class="mono" x="1238" y="277">2047</text>
  </g>

  <rect class="note" x="80" y="905" width="1320" height="62" rx="10"/>
  <text class="label" x="100" y="932">NV12：Y 区容纳 8 行，单个 UV slot 容纳 4 行；P010：Y 区容纳 4 行，单个 UV slot 容纳 2 行。</text>
  <text class="small" x="100" y="954">bank 和 UV slot 的归属由内部调度控制；软件只配置 UBWC 输出 base address，不配置 SRAM 内部分区地址。</text>
</svg>
