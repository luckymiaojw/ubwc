<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .lane{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .box{fill:#fff;stroke:#334155;stroke-width:2}
      .uv{fill:#fed7aa;stroke:#f97316;stroke-width:2}
      .y{fill:#bbf7d0;stroke:#22c55e;stroke-width:2}
      .rd{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .title{font:700 28px Arial,"Noto Sans CJK SC",sans-serif;fill:#111827}
      .h2{font:700 20px Arial,"Noto Sans CJK SC",sans-serif;fill:#111827}
      .txt{font:15px Arial,"Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:13px Arial,"Noto Sans CJK SC",sans-serif;fill:#475569}
      .mono{font:13px "Menlo","Consolas",monospace;fill:#1f2937}
      .line{stroke:#0f172a;stroke-width:2;fill:none}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none}
      .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1040"/>
  <text class="title" x="56" y="58">DEC NV12 Rotation Metadata 数据读写流程</text>
  <text class="txt" x="56" y="92">AXI 读侧以整段为单位填充 ping/pang；metadata decode 侧按行从 bank 中交错读出 UV 与 Y。</text>

  <rect class="lane" x="52" y="130" width="1496" height="184" rx="14"/>
  <text class="h2" x="78" y="166">1. AXI meta read：整段写入当前 bank</text>
  <rect class="uv" x="90" y="204" width="210" height="62" rx="6"/>
  <text class="mono" x="128" y="240">read UV segment</text>
  <rect class="y" x="360" y="204" width="210" height="62" rx="6"/>
  <text class="mono" x="408" y="240">read Y segment A</text>
  <rect class="y" x="630" y="204" width="210" height="62" rx="6"/>
  <text class="mono" x="678" y="240">read Y segment B</text>
  <rect class="uv" x="900" y="204" width="210" height="62" rx="6"/>
  <text class="mono" x="934" y="240">read next UV</text>
  <rect class="rd" x="1190" y="196" width="250" height="78" rx="8"/>
  <text class="mono" x="1230" y="232">commit PING bank</text>
  <text class="small" x="1222" y="254">整段写完后才允许读出</text>
  <path class="line arrow" d="M300,235 H360"/>
  <path class="line arrow" d="M570,235 H630"/>
  <path class="line arrow" d="M840,235 H900"/>
  <path class="line arrow" d="M1110,235 H1190"/>

  <rect class="lane" x="52" y="350" width="1496" height="450" rx="14"/>
  <text class="h2" x="78" y="386">2. Bank read scheduler：逐行交错读出</text>
  <text class="txt" x="78" y="416">写入后的 bank 里已经有完整 segment；读调度器不再线性 drain block，而是按 row/segment 选择 entry。</text>

  <rect class="card" x="90" y="452" width="1380" height="92" rx="12"/>
  <text class="mono" x="130" y="488">for k = 0..7:</text>
  <text class="mono" x="310" y="488">emit UV row k across all X blocks</text>
  <text class="mono" x="700" y="488">emit Y row 2k across all X blocks</text>
  <text class="mono" x="1080" y="488">emit Y row 2k+1 across all X blocks</text>
  <text class="small" x="130" y="518">row 内部按 X block 连续吐出，保证 metadata decode 的 tile 坐标顺序与 OTF 行输出一致。</text>

  <rect class="uv" x="110" y="590" width="250" height="60" rx="6"/>
  <text class="mono" x="138" y="626">UV row k, x0..xN</text>
  <rect class="y" x="460" y="590" width="250" height="60" rx="6"/>
  <text class="mono" x="500" y="626">Y row 2k, x0..xN</text>
  <rect class="y" x="810" y="590" width="250" height="60" rx="6"/>
  <text class="mono" x="842" y="626">Y row 2k+1, x0..xN</text>
  <rect class="rd" x="1180" y="582" width="250" height="76" rx="8"/>
  <text class="mono" x="1222" y="616">metadata decode</text>
  <text class="small" x="1212" y="640">生成 ci / tile command</text>
  <path class="line arrow" d="M360,620 H460"/>
  <path class="line arrow" d="M710,620 H810"/>
  <path class="line arrow" d="M1060,620 H1180"/>

  <path class="dash arrow" d="M235,650 C235,710 1245,710 1245,660"/>
  <text class="small" x="492" y="742">下一行继续：UV row k+1 -> Y row 2k+2 -> Y row 2k+3</text>

  <rect class="lane" x="52" y="838" width="1496" height="140" rx="14"/>
  <text class="h2" x="78" y="874">3. Ping / Pang 并行关系</text>
  <rect class="rd" x="96" y="910" width="320" height="46" rx="6"/>
  <text class="mono" x="132" y="940">PING: read row-interleaved</text>
  <rect class="box" x="520" y="910" width="320" height="46" rx="6"/>
  <text class="mono" x="546" y="940">PANG: AXI writes next segment</text>
  <rect class="box" x="944" y="910" width="420" height="46" rx="6"/>
  <text class="mono" x="974" y="940">swap after current bank drained</text>
  <path class="line arrow" d="M416,933 H520"/>
  <path class="line arrow" d="M840,933 H944"/>
  <text class="txt" x="78" y="1000">这个模型保留整段写入的 AXI 效率，同时让读出顺序贴合最终 OTF 行输出，避免“UV 全吐完再吐 Y”的错误节奏。</text>
</svg>
