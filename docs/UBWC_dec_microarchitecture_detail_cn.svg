  <text x="70" y="918" class="panelTitle">4. VIVO clock crossing and decompression</text>
  <rect x="120" y="990" width="230" height="62" class="vivo"/>
  <text x="170" y="1016" class="boxText">u_vivo_ci_async_fifo</text>
  <text x="150" y="1036" class="small">i_axi_clk to i_vivo_clk</text>
  <rect x="450" y="990" width="230" height="62" class="vivo"/>
  <text x="498" y="1016" class="boxText">u_vivo_cvi_async_fifo</text>
  <text x="480" y="1036" class="small">data[255:0] CDC</text>
  <rect x="780" y="990" width="230" height="62" class="vivo"/>
  <text x="832" y="1016" class="boxText">ubwc_dec_vivo_top</text>
  <text x="832" y="1036" class="small">decompression core</text>
  <rect x="1110" y="990" width="230" height="62" class="vivo"/>
