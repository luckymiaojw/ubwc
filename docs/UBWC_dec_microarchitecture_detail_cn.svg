  <text x="1140" y="1036" class="small">i_vivo_clk to i_axi_clk</text>
  <rect x="1440" y="1005" width="180" height="32" class="tag"/>
  <text x="1492" y="1026" class="tagText">rvo_bus</text>
  <path class="main" d="M 1645 762 V 850 H 235 V 990"/>
  <text x="256" y="958" class="sig">tile_to_vivo_bus</text>
  <path class="cdc" d="M 350 1021 H 450"/>
  <text x="374" y="1007" class="sig">CI fields</text>
  <path class="cdc" d="M 680 1021 H 780"/>
  <text x="700" y="1007" class="sig">CVI[255:0]</text>
