<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1600" viewBox="0 0 2480 1600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .lane { font-size: 15px; font-weight: 700; fill: #334155; }
      .panelTitle { font-size: 15px; font-weight: 700; }
      .boxText { font-size: 13px; font-weight: 700; }
      .small { font-size: 11px; fill: #334155; }
      .sig { font-size: 11px; fill: #0f172a; }
      .tagText { font-size: 11px; font-weight: 700; fill: #1e3a8a; }
      .note { font-size: 11px; fill: #9a3412; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .apb { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .axi { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .vivo { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 8; }
      .otf { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .mem { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 8; }
      .tag { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; rx: 14; }
      .warn { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; rx: 10; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main { fill: none; stroke: #0f172a; stroke-width: 3.2; marker-end: url(#arrow); }
      .cfg { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .err { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .cdc { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2480" height="1600" fill="#f8fafc"/>
  <rect width="2480" height="1600" fill="url(#grid)" opacity="0.85"/>
  <text x="40" y="48" class="title">DEC Microarchitecture Detail - Current RTL</text>
  <text x="40" y="70" class="subtitle">One continuous frame-data backbone, with side branches for AXI read fabric, config, and status. Lines stay on corridors and avoid module boxes.</text>

  <rect x="0" y="100" width="2480" height="180" fill="#fff7ed" opacity="0.70"/>
  <rect x="0" y="300" width="2480" height="620" fill="#ecfdf5" opacity="0.78"/>
  <rect x="0" y="940" width="2480" height="180" fill="#f5f3ff" opacity="0.80"/>
  <rect x="0" y="1140" width="2480" height="360" fill="#eff6ff" opacity="0.80"/>
  <text x="24" y="130" class="lane">APB / pclk</text>
  <text x="24" y="330" class="lane">AXI-control / i_axi_clk</text>
  <text x="24" y="970" class="lane">VIVO / i_vivo_clk</text>
  <text x="24" y="1170" class="lane">OTF / i_otf_clk + line SRAM</text>

  <rect x="40" y="120" width="1520" height="130" class="panel"/>
  <text x="70" y="148" class="panelTitle">1. Reset / APB / frame fcnt / status</text>
  <rect x="120" y="170" width="210" height="56" class="apb"/>
  <text x="168" y="194" class="boxText">ubwc_dec_rstn_gen</text>
  <text x="148" y="214" class="small">ctrl/sram/vivo/otf reset</text>
  <rect x="420" y="170" width="230" height="56" class="apb"/>
  <text x="466" y="194" class="boxText">ubwc_dec_apb_reg_blk</text>
  <text x="462" y="214" class="small">cfg, address slot, IRQ ctrl</text>
  <rect x="740" y="170" width="210" height="56" class="apb"/>
  <text x="788" y="194" class="boxText">frame fcnt logic</text>
  <text x="770" y="214" class="small">active/next fcnt[3:0]</text>
  <rect x="1040" y="170" width="210" height="56" class="apb"/>
  <text x="1088" y="194" class="boxText">ubwc_dec_status</text>
  <text x="1080" y="214" class="small">done/error/count/IRQ</text>
  <rect x="1320" y="160" width="190" height="32" class="tag"/>
  <text x="1362" y="181" class="tagText">cfg_bus[31:0]</text>
  <rect x="1320" y="205" width="190" height="32" class="tag"/>
  <text x="1344" y="226" class="tagText">frame_start + fcnt[3:0]</text>
  <path class="cfg" d="M 330 198 H 420"/>
  <path class="cfg" d="M 650 198 H 740"/>
  <path class="cfg" d="M 950 198 H 1040"/>
  <path class="cfg" d="M 650 180 H 1320"/>
  <path class="cfg" d="M 950 220 H 1320"/>

  <rect x="40" y="320" width="1380" height="230" class="panel"/>
  <text x="70" y="348" class="panelTitle">2. Metadata path: ubwc_dec_meta_data_gen</text>
  <rect x="120" y="410" width="240" height="62" class="axi"/>
  <text x="164" y="436" class="boxText">meta_get_cmd_gen</text>
  <text x="154" y="456" class="small">meta base by fcnt[0]</text>
  <rect x="460" y="410" width="260" height="62" class="axi"/>
  <text x="510" y="436" class="boxText">meta_axi_rcmd_gen</text>
  <text x="492" y="456" class="small">AR + rsp FIFO + lane select</text>
  <rect x="820" y="410" width="250" height="62" class="axi"/>
  <text x="874" y="436" class="boxText">meta_data_decode</text>
  <text x="870" y="456" class="small">metadata byte to dec_meta</text>
  <rect x="1140" y="402" width="220" height="32" class="tag"/>
  <text x="1188" y="423" class="tagText">dec_meta_bus</text>
  <rect x="1140" y="455" width="220" height="32" class="tag"/>
  <text x="1188" y="476" class="tagText">meta_axi_bus</text>
  <rect x="120" y="495" width="660" height="34" class="warn"/>
  <text x="140" y="516" class="note">Current RTL: no metadata ping-pong SRAM here. metadata = get_cmd + axi_rcmd + decode.</text>
