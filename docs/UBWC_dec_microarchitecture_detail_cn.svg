  <path class="flow" d="M 340 721 H 430"/>
  <text x="352" y="707" class="sig">cmd_addr[63:0]</text>
  <path class="flow" d="M 620 721 H 710"/>
  <text x="636" y="707" class="sig">ci_fifo_dout</text>
  <path class="flow" d="M 900 721 H 990"/>
  <text x="916" y="707" class="sig">AR fire</text>
  <path class="flow" d="M 1210 721 H 1300"/>
  <text x="1224" y="707" class="sig">AXI R[255:0]</text>
  <path class="flow" d="M 805 690 V 640 H 1645 V 674"/>
  <path class="main" d="M 1500 721 H 1560"/>

  <path class="flow" d="M 1645 674 V 555 H 1580"/>
  <text x="1656" y="616" class="sig">tile_axi_bus</text>

