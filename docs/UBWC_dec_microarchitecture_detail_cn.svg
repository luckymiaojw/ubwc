  <path class="main" d="M 1070 430 H 1140"/>
  <path class="flow" d="M 590 472 V 510 H 1140 V 471"/>

  <rect x="1500" y="320" width="900" height="230" class="panel"/>
  <text x="1530" y="348" class="panelTitle">Shared AXI read fabric</text>
  <rect x="1580" y="410" width="220" height="62" class="axi"/>
  <text x="1624" y="436" class="boxText">axi_2t1_int_DW_axi</text>
  <text x="1616" y="456" class="small">merge meta/tile AR/R</text>
  <rect x="1900" y="410" width="230" height="62" class="axi"/>
  <text x="1944" y="436" class="boxText">ubwc_x2x_DW_axi_x2x</text>
  <text x="1946" y="456" class="small">internal 256b to external</text>
  <rect x="2220" y="410" width="130" height="62" class="axi"/>
  <text x="2254" y="436" class="boxText">AXI M</text>
  <text x="2236" y="456" class="small">AR/R external</text>
