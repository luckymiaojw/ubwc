<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980">
  <defs>
    <style>
      .bg{fill:#f7fafc}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .title{font:700 28px Arial,"Noto Sans CJK SC",sans-serif;fill:#111827}
      .h2{font:700 22px Arial,"Noto Sans CJK SC",sans-serif;fill:#111827}
      .txt{font:16px Arial,"Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:13px Arial,"Noto Sans CJK SC",sans-serif;fill:#475569}
      .mono{font:13px "Menlo","Consolas",monospace;fill:#1f2937}
      .uv{fill:#fed7aa;stroke:#f97316;stroke-width:2}
      .y{fill:#bbf7d0;stroke:#22c55e;stroke-width:2}
      .rgba{fill:#bfdbfe;stroke:#3b82f6;stroke-width:2}
      .line{stroke:#0f172a;stroke-width:2;fill:none}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6;fill:none}
      .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1520" height="980"/>

  <text class="title" x="56" y="58">DEC Rotation Metadata Ping-Pong SRAM 存储模型</text>
  <text class="txt" x="56" y="92">写入保持整段写入：AXI 连续读取 8x8 metadata block 后写入当前 bank；读出阶段在 bank 内按行交错调度。</text>
  <text class="txt" x="56" y="118">P010 当前不做旋转；NV12 rotation 使用下面的 UV/Y 行交错读出模型。</text>

  <rect class="card" x="48" y="150" width="1424" height="250" rx="16"/>
  <text class="h2" x="80" y="188">1. RGBA8888 / RGBA1010102：单 plane 整段写入，按行读出</text>
  <text class="txt" x="80" y="218">不需要 UV/Y 交错；一个 ping/pang bank 保存一条 metadata stripe。</text>
  <rect class="rgba" x="100" y="252" width="1280" height="72" rx="6"/>
  <text class="txt" x="640" y="286">RGBA metadata stripe：N 个 8x8 metadata block</text>
  <text class="mono" x="122" y="352">write: block0, block1, ..., blockN-1</text>
  <text class="mono" x="710" y="352">read: row0 across X, row1 across X, ...</text>

  <rect class="card" x="48" y="430" width="1424" height="410" rx="16"/>
  <text class="h2" x="80" y="468">2. NV12：写入是整段，读出是逐行 UV/Y/Y 交错</text>
  <text class="txt" x="80" y="500">一个完整 ping/pang bank 中保留 UV segment 与两段 Y segment；segment 是整段写入，读出时按输出行关系重排。</text>

  <text class="small" x="100" y="548">Bank PING 写入后的物理存储</text>
  <rect class="uv" x="100" y="568" width="280" height="82" rx="6"/>
  <text class="txt" x="198" y="606">UV segment</text>
  <text class="mono" x="174" y="630">UV row 0..7</text>
  <rect class="y" x="400" y="568" width="360" height="82" rx="6"/>
  <text class="txt" x="548" y="606">Y segment A</text>
  <text class="mono" x="512" y="630">Y row 0..7</text>
  <rect class="y" x="780" y="568" width="360" height="82" rx="6"/>
  <text class="txt" x="928" y="606">Y segment B</text>
  <text class="mono" x="888" y="630">Y row 8..15</text>
  <rect class="uv" x="1160" y="568" width="200" height="82" rx="6"/>
  <text class="txt" x="1218" y="606">next UV</text>
  <text class="mono" x="1194" y="630">prefetch</text>

  <text class="small" x="100" y="698">读出逻辑顺序</text>
  <path class="line arrow" d="M140,730 H310"/>
  <path class="line arrow" d="M390,730 H560"/>
  <path class="line arrow" d="M640,730 H810"/>
  <path class="line arrow" d="M890,730 H1060"/>
  <rect class="uv" x="100" y="760" width="220" height="54" rx="6"/>
  <text class="mono" x="128" y="793">UV row k, all X</text>
  <rect class="y" x="360" y="760" width="220" height="54" rx="6"/>
  <text class="mono" x="392" y="793">Y row 2k</text>
  <rect class="y" x="620" y="760" width="220" height="54" rx="6"/>
  <text class="mono" x="646" y="793">Y row 2k+1</text>
  <rect class="uv" x="880" y="760" width="220" height="54" rx="6"/>
  <text class="mono" x="908" y="793">UV row k+1</text>
  <text class="txt" x="1130" y="782">最终对应 OTF 行节奏：</text>
  <text class="mono" x="1130" y="808">(Y,UV), Y, (Y,UV), Y ...</text>

  <rect class="card" x="48" y="870" width="1424" height="74" rx="14"/>
  <text class="txt" x="80" y="910">关键约束：bank commit 仍以整段写满为单位；读出阶段只改变 bank 内访问顺序，不改变 AXI meta 读 burst 的连续性。</text>
</svg>
